<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs><text x="410" y="26" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two distinct lines (degree 1) cross at most once</text><line x1="110" y1="300" x2="567.6" y2="300" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/><line x1="110" y1="300" x2="110" y2="56.20000000000002" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/><text x="579.6" y="305" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="italic" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">x</text><text x="104" y="48.20000000000002" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="italic" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">y</text><line x1="110" y1="272.4" x2="514.8" y2="124.28" stroke="#1a1a1a" stroke-width="2.2"/><line x1="110" y1="139.0" x2="550.0" y2="254.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="322.66666666666663" y1="194.58333333333334" x2="322.66666666666663" y2="300" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="322.66666666666663" y1="194.58333333333334" x2="110" y2="194.58333333333334" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="322.66666666666663" cy="194.58333333333334" r="5" fill="#1a1a1a"/><text x="334.66666666666663" y="184.58333333333334" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">the only shared point</text><text x="524.8" y="128.28" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">P</text><text x="560.0" y="258.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Q</text><text x="410" y="348" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Two distinct degree-1 polynomials agree on at most 1 point; agreeing on 2 or more would force P = Q.</text><text x="410" y="366" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">In general two distinct polynomials of degree below d agree on fewer than d points.</text></svg>