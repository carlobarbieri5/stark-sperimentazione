<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs><text x="470" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Algebraic Intermediate Representation (AIR) = three ingredients</text><rect x="30.0" y="58" width="280" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="81" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Public inputs</text><line x1="42.0" y1="89" x2="298.0" y2="89" stroke="#9aa0a6" stroke-width="1"/><text x="170.0" y="109.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">values known to both</text><text x="170.0" y="127.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">prover and verifier</text><text x="170.0" y="144.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(e.g. start x, result y)</text><rect x="330.0" y="58" width="280" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="470.0" y="81" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Transition constraints</text><line x1="342.0" y1="89" x2="598.0" y2="89" stroke="#9aa0a6" stroke-width="1"/><text x="470.0" y="109.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">polynomials that are 0 on</text><text x="470.0" y="127.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">every legal step and</text><text x="470.0" y="144.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">non-zero on any illegal one</text><rect x="630.0" y="58" width="280" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="770.0" y="81" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Boundary assertions</text><line x1="642.0" y1="89" x2="898.0" y2="89" stroke="#9aa0a6" stroke-width="1"/><text x="770.0" y="109.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">tie public inputs to</text><text x="770.0" y="127.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">specific cells of the trace</text><text x="770.0" y="144.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(first / last rows)</text><text x="470" y="232" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">A pair (current state, next state) is valid iff every transition constraint vanishes on it.</text></svg>