<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs><text x="480" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Arithmetization: from a computation to a checkable algebraic claim</text><rect x="30.0" y="60" width="205" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="132.5" y="83" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Computational claim</text><line x1="42.0" y1="91" x2="223.0" y2="91" stroke="#9aa0a6" stroke-width="1"/><text x="132.5" y="111.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">From state x, after</text><text x="132.5" y="129.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">N steps of program P,</text><text x="132.5" y="146.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">the result is y.</text><rect x="261.66666666666663" y="60" width="205" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="364.16666666666663" y="83" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Reduction</text><line x1="273.66666666666663" y1="91" x2="454.66666666666663" y2="91" stroke="#9aa0a6" stroke-width="1"/><text x="364.16666666666663" y="111.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">produce low-degree</text><text x="364.16666666666663" y="129.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">polynomials and a</text><text x="364.16666666666663" y="146.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">degree bound d.</text><rect x="493.3333333333333" y="60" width="205" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="595.8333333333333" y="83" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Algebraic claim</text><line x1="505.3333333333333" y1="91" x2="686.3333333333333" y2="91" stroke="#9aa0a6" stroke-width="1"/><text x="595.8333333333333" y="111.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">there exist low-degree</text><text x="595.8333333333333" y="129.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">polynomials meeting a</text><text x="595.8333333333333" y="146.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">fixed set of identities.</text><rect x="725.0" y="60" width="205" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.6"/><text x="827.5" y="83" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Soundness theorem</text><line x1="737.0" y1="91" x2="918.0" y2="91" stroke="#9aa0a6" stroke-width="1"/><text x="827.5" y="111.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">if the identities fail,</text><text x="827.5" y="129.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">almost every random</text><text x="827.5" y="146.5" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">point exposes the lie.</text><line x1="239.0" y1="135.0" x2="257.66666666666663" y2="135.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)"/><line x1="470.66666666666663" y1="135.0" x2="489.3333333333333" y2="135.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)"/><line x1="702.3333333333333" y1="135.0" x2="721.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)"/><text x="480" y="250" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">&#8220;Low degree&#8221; means degree far below the field size &#8212; the property a random query can test cheaply.</text></svg>