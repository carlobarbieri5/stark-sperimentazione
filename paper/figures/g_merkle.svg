e="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">leaves = evaluations of the polynomial &#183; every internal node is a hash of its two children</text><rect x="250" y="320" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.0"/><text x="274" y="332" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">queried leaf</text><rect x="430" y="320" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5 4"/><text x="454" y="332" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">authentication path (revealed siblings)</text></svg>