<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs><text x="450" y="26" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Idealized polynomial commitment scheme (no low-degree test needed)</text><rect x="362" y="52" width="176" height="70" rx="9" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="450" y="84" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Tom</text><text x="450" y="103" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">trusted store</text><rect x="66" y="206" width="170" height="62" rx="9" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.7"/><text x="151" y="234" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Bob</text><text x="151" y="253" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">prover</text><rect x="664" y="206" width="170" height="62" rx="9" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.7"/><text x="749" y="234" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Alice</text><text x="749" y="253" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">verifier</text><line x1="176" y1="204" x2="392" y2="124" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#ah)"/><text x="120" y="150" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">commit: send P(X),</text><text x="120" y="166" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">deg P &lt; d</text><line x1="672" y1="200" x2="516" y2="126" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#ah)"/><text x="560" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">query &#945;</text><line x1="528" y1="134" x2="700" y2="200" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#ah)"/><text x="600" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">answer P(&#945;)</text><text x="450" y="290" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Because Tom is trusted, the stored object is guaranteed to have degree &lt; d — so FRI is not yet required.</text></svg>